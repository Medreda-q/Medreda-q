<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glow-left" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>

    <!-- Hairline Divider -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="898" height="178" x="1" y="1" rx="14" fill="url(#bg)" stroke="#21262d" stroke-width="1" />

  <!-- Subtle Pattern -->
  <rect width="898" height="178" x="1" y="1" rx="14" fill="url(#dots)" />

  <!-- Soft Ambient Glows -->
  <rect width="898" height="178" x="1" y="1" rx="14" fill="url(#glow-left)" />
  <rect width="898" height="178" x="1" y="1" rx="14" fill="url(#glow-right)" />

  <!-- Pill Badge: Status -->
  <g transform="translate(450, 36)">
    <rect x="-115" y="-12" width="230" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="-92" cy="0" r="3.5" fill="#3fb950" />
    <text x="-80" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" letter-spacing="1">OPEN TO INTERNSHIPS</text>
  </g>

  <!-- Main Name -->
  <text x="450" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="url(#name-grad)">MOHAMED REDA QIYAOUI</text>

  <!-- Elegant Hairline Divider -->
  <line x1="260" y1="116" x2="640" y2="116" stroke="url(#hairline)" stroke-width="1.2" />

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13.5" font-weight="400" letter-spacing="0.5" fill="#8b949e">Cybersecurity &amp; Information Systems Audit · EST Tétouan</text>
</svg>
