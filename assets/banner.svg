<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .terminal-header { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 1.5px; fill: url(#text-grad); }
    .subtitle { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; font-weight: 500; fill: #c9d1d9; }
    .tag { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 600; fill: #58a6ff; }
  </style>

  <!-- Container Box -->
  <rect width="848" height="198" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Grid Background Pattern -->
  <rect width="848" height="198" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- Terminal Top Bar -->
  <rect width="848" height="34" x="1" y="1" rx="10" fill="#161b22" />
  <rect width="848" height="10" x="1" y="25" fill="#161b22" />
  <line x1="1" y1="35" x2="849" y2="35" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <!-- Terminal Prompt Title -->
  <text x="425" y="22" text-anchor="middle" class="terminal-header">medreda-q@cyber-lab: ~ (security-ops)</text>

  <!-- Main Content -->
  <g transform="translate(425, 82)">
    <text x="0" y="0" text-anchor="middle" class="title">MOHAMED REDA QIYAOUI</text>
  </g>

  <g transform="translate(425, 114)">
    <text x="0" y="0" text-anchor="middle" class="subtitle">Cybersecurity &amp; Information Systems Audit · EST Tétouan</text>
  </g>

  <!-- Decorative Divider -->
  <line x1="175" y1="135" x2="675" y2="135" stroke="url(#line-grad)" stroke-width="1.5" />

  <!-- Tags / Focus Areas -->
  <g transform="translate(425, 165)">
    <!-- Tag 1: SOC Operations -->
    <rect x="-260" y="-14" width="155" height="24" rx="4" fill="#0d1117" stroke="#1f6feb" stroke-width="1" />
    <text x="-182" y="3" text-anchor="middle" class="tag">🛡️ SOC OPERATIONS</text>

    <!-- Tag 2: Blue & Red Team -->
    <rect x="-80" y="-14" width="160" height="24" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1" />
    <text x="0" y="3" text-anchor="middle" class="tag" style="fill: #3fb950;">⚔️ BLUE &amp; RED TEAM</text>

    <!-- Tag 3: Lab Engineering -->
    <rect x="105" y="-14" width="155" height="24" rx="4" fill="#0d1117" stroke="#8957e5" stroke-width="1" />
    <text x="182" y="3" text-anchor="middle" class="tag" style="fill: #bc8cff;">🧪 SECURITY LABS</text>
  </g>
</svg>
